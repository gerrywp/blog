baseURL: https://gerrywp.github.io/blog/
locale: zh-CN
languageCode: zh-CN
title: 大仙
theme: ["PaperMod"]

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
min_version: v0.146.0
max_version: v0.160.1
#googleAnalytics: G-xxxxxxxxxx #谷歌分析示例
defaultContentLanguage: zh
hasCJKLanguage: true  # 支持中文排版
minify:
  disableXML: true
  minifyOutput: true
  
pagination:
  disableAliases: false
  pagerSize: 4
 
params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: ExampleSite
  description: "专注于IT互联网，包括但不限于Go语言(golang)、csharp、项目管理、软件架构等"
  keywords: [go语言,项目管理,软件架构,自动化]
  author: Gerry
  # author: ["Me", "You"] # multiple authors
  images: ["<link or path of image for opengraph, twitter-cards>"]
  DateFormat: "January 2, 2006"
  defaultTheme: auto # dark, light
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false
  ShowWordCount: true
  ShowRssButtonInSectionTermList: false #RSS订阅按钮
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: true
  hidemeta: false
  hideSummary: false
  showtoc: true #生成文章目录
  tocopen: true #目录默认展开
  tocSide: "right"
  maxTocLevel: 3
  customCSS: ["css/extended/blank.css"]
  assets:
    # disableHLJS: true # to disable highlight.js
    # disableFingerprinting: true
    favicon: "img/logo.ico"
    #favicon16x16: "<link / abs url>"
    #favicon32x32: "<link / abs url>"
    apple_touch_icon: "img/logo.ico"
    #safari_pinned_tab: "<link / abs url>"

  label:
    text: "Home"
    icon: img/logo.ico #站点标题图标
    iconHeight: 24

  # profile-mode
  profileMode:
    enabled: true # needs to be explicitly set
    title: 大仙
    subtitle: "千山鸟飞绝，万径人踪灭。孤舟蓑笠翁，独钓寒江雪。"
    imageUrl: "img/avatar.png"
    imageWidth: 120
    imageHeight: 120
    imageTitle: foreaver
    buttons:
      - name: Posts
        url: posts
      - name: Tags
        url: tags

  # home-info mode
  homeInfoParams:
    Title: "Hi there \U0001F44B"
    Content: Welcome to my blog

  #socialIcons:
  #  - name: x
  #    url: "https://x.com/"
  #  - name: stackoverflow
  #    url: "https://stackoverflow.com"
  #  - name: github
  #    url: "https://github.com/"

  #analytics:
  #  google:
  #    SiteVerificationTag: "获取 Google 验证代码" #问豆包
  #  bing:
  #    SiteVerificationTag: "XYZabc"

  cover:
    hidden: true # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: true # hide on single page

  editPost:
    URL: "https://github.com/gerrywp/blog/content"
    Text: "Suggest Changes" # edit text
    appendFilePath: true # to append file path to Edit link

  # for search
  # https://fusejs.io/api/options.html
  #fuseOpts:
  #  isCaseSensitive: false
  #  shouldSort: true
  #  location: 0
  #  distance: 1000
  #  threshold: 0.4
  #  minMatchCharLength: 0
  #  limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
  #  keys: ["title", "permalink", "summary", "content"]
  
outputFormats:
  llms:
    mediaType: "text/plain"
    baseName: "llms"
    isPlainText: true
    notAlternative: true

outputs:
  home:
    - HTML
    #- RSS
    - JSON
    - llms

languages:
    zh:
      languageName: "简体中文"
      weight: 1
      taxonomies:
        category: categories
        tag: tags
        archive: archives
      menu:
        main:
          - identifier: search
            name: 搜索
            url: /search/
            weight: 10
          - identifier: archives
            name: 归档
            url: /archives/
            weight: 20
          - identifier: categories
            name: 分类
            url: /categories/
            weight: 30
          - identifier: tags
            name: 标签
            url: /tags/
            weight: 40

# Read: https://github.com/adityatelange/hugo-PaperMod/wiki/FAQs#using-hugos-syntax-highlighter-chroma
pygmentsUseClasses: true
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    anchorLineNos: true
    codeFences: true
    guessSyntax: true
    lineNos: true
    style: monokai
