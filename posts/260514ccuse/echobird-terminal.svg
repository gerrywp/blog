<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="'Courier New', 'Consolas', monospace">
  <defs>
    <linearGradient id="term-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="header-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Terminal Window -->
  <rect x="20" y="20" width="660" height="260" rx="10" fill="url(#term-grad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title Bar -->
  <rect x="20" y="20" width="660" height="32" rx="10" fill="url(#header-grad)"/>
  <rect x="20" y="38" width="660" height="14" fill="url(#header-grad)"/>

  <!-- Window Buttons -->
  <circle cx="48" cy="36" r="6" fill="#ef4444"/>
  <circle cx="68" cy="36" r="6" fill="#f59e0b"/>
  <circle cx="88" cy="36" r="6" fill="#22c55e"/>

  <!-- Title Text -->
  <text x="350" y="41" text-anchor="middle" font-size="12" fill="#94a3b8" font-family="'Segoe UI', 'PingFang SC', sans-serif">Echobird — 快速配置</text>

  <!-- Terminal Lines -->
  <text x="40" y="80" font-size="13" fill="#22c55e">&gt;</text>
  <text x="60" y="80" font-size="13" fill="#e2e8f0"># 1. 下载并启动 Echobird</text>

  <text x="40" y="105" font-size="13" fill="#22c55e">&gt;</text>
  <text x="60" y="105" font-size="13" fill="#93c5fd">curl -fsSL https://github.com/echobird/releases/latest</text>

  <text x="40" y="130" font-size="13" fill="#22c55e">&gt;</text>
  <text x="60" y="130" font-size="13" fill="#e2e8f0"># 2. 设置环境变量</text>

  <text x="40" y="155" font-size="13" fill="#22c55e">&gt;</text>
  <text x="60" y="155" font-size="13" fill="#a5b4fc">export ECHO_UPSTREAM_BASE_URL=</text>
  <text x="388" y="155" font-size="13" fill="#fbbf24">"https://api.deepseek.com/v1"</text>

  <text x="40" y="180" font-size="13" fill="#22c55e">&gt;</text>
  <text x="60" y="180" font-size="13" fill="#a5b4fc">export ECHO_UPSTREAM_API_KEY=</text>
  <text x="406" y="180" font-size="13" fill="#fbbf24">"sk-your-api-key-here"</text>

  <text x="40" y="205" font-size="13" fill="#22c55e">&gt;</text>
  <text x="60" y="205" font-size="13" fill="#e2e8f0"># 3. 启动服务</text>

  <text x="40" y="230" font-size="13" fill="#22c55e">&gt;</text>
  <text x="60" y="230" font-size="13" fill="#93c5fd">echobird --port 11434</text>

  <!-- Blinking cursor -->
  <text x="40" y="260" font-size="13" fill="#22c55e">&gt;</text>
  <rect x="60" y="248" width="8" height="15" fill="#22c55e" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1s" repeatCount="indefinite"/>
  </rect>
  <text x="72" y="260" font-size="13" fill="#64748b"># 服务已启动，等待 Codex 连接...</text>
</svg>
